    // --- Audio Synthesis & Sound Effects ---
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSentSound() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.09);
      } catch (e) {}
    }

    function startRingtone() {
      try {
        const ctx = getAudioContext();
        let isPlaying = true;
        let timeoutId;
        const playBeep = () => {
          if (!isPlaying) return;
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();
          osc1.type = 'sine';
          osc2.type = 'sine';
          osc1.frequency.value = 440;
          osc2.frequency.value = 480;
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);
          osc1.start();
          osc2.start();
          osc1.stop(ctx.currentTime + 1.2);
          timeoutId = setTimeout(() => {
            if (isPlaying) playBeep();
          }, 3000);
        };
        playBeep();
        return () => {
          isPlaying = false;
          clearTimeout(timeoutId);
        };
      } catch (e) {
        return () => {};
      }
    }

    // --- Real Voice Recorder Utility ---
    class RealVoiceRecorder {
      constructor() {
        this.mediaRecorder = null;
        this.audioChunks = [];
        this.stream = null;
        this.startTime = 0;
      }

      async start() {
        try {
          this.audioChunks = [];
          this.stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          });
          let mimeType = 'audio/webm';
          if (!MediaRecorder.isTypeSupported('audio/webm')) {
            if (MediaRecorder.isTypeSupported('audio/mp4')) {
              mimeType = 'audio/mp4';
            } else if (MediaRecorder.isTypeSupported('audio/ogg')) {
              mimeType = 'audio/ogg';
            } else {
              mimeType = '';
            }
          }
          const options = mimeType ? { mimeType } : undefined;
          this.mediaRecorder = new MediaRecorder(this.stream, options);
          this.mediaRecorder.ondataavailable = (event) => {
            if (event.data && event.data.size > 0) {
              this.audioChunks.push(event.data);
            }
          };
          this.mediaRecorder.start(100);
          this.startTime = Date.now();
          return true;
        } catch (err) {
          console.error("Microphone access error:", err);
          return false;
        }
      }

      stop() {
        return new Promise((resolve) => {
          if (!this.mediaRecorder || this.mediaRecorder.state === 'inactive') {
            resolve(null);
            return;
          }
          const calculatedDuration = Math.max(1, Math.round((Date.now() - this.startTime) / 1000));
          this.mediaRecorder.onstop = () => {
            const mimeType = this.mediaRecorder?.mimeType || 'audio/webm';
            const audioBlob = new Blob(this.audioChunks, { type: mimeType });
            if (this.stream) {
              this.stream.getTracks().forEach(track => track.stop());
              this.stream = null;
            }
            const reader = new FileReader();
            reader.onloadend = () => {
              resolve({
                audioBlob,
                dataUrl: reader.result,
                duration: calculatedDuration
              });
            };
            reader.onerror = () => {
              resolve({
                audioBlob,
                dataUrl: '',
                duration: calculatedDuration
              });
            };
            reader.readAsDataURL(audioBlob);
          };
          this.mediaRecorder.stop();
        });
      }

      cancel() {
        if (this.mediaRecorder && this.mediaRecorder.state !== 'inactive') {
          this.mediaRecorder.stop();
        }
        if (this.stream) {
          this.stream.getTracks().forEach(track => track.stop());
          this.stream = null;
        }
        this.audioChunks = [];
      }
    }

        audio.onended = () => {

        reader.onload = (event) => {
          setPendingMediaUpload({
            url: event.target.result,
            type: type,
            fileName: file.name
          });
          setMediaCaption('');
        };
        reader.onerror = () => {
          alert("Failed to read file. Please try selecting again.");
        };
        reader.readAsDataURL(file);

        // Reset target immediately so selecting the same or another file always triggers onChange
        e.target.value = '';
      };

      // Trigger file selector dynamically to ensure reliable click response every time
      const triggerFilePicker = (type) => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = type === 'image' ? 'image/*' : 'video/*';
        input.onchange = (e) => handleSelectMediaFile(e, type);
        input.click();
      };

      const handleConfirmSendPendingMedia = async () => {
        if (!pendingMediaUpload || isUploadingMedia) return;
        setIsUploadingMedia(true);

        const currentUpload = pendingMediaUpload;
        const currentCaption = mediaCaption;

        // Reset state immediately so user is never stuck
        setPendingMediaUpload(null);
        setMediaCaption('');
        setIsUploadingMedia(false);

        await handleSendMessage(currentCaption, currentUpload.url, currentUpload.type);

        if (fileInputRef.current) fileInputRef.current.value = '';
        if (videoInputRef.current) videoInputRef.current.value = '';
      };

      const handleCancelPendingMedia = () => {
        setPendingMediaUpload(null);
        setMediaCaption('');
        setIsUploadingMedia(false);
        if (fileInputRef.current) fileInputRef.current.value = '';
        if (videoInputRef.current) videoInputRef.current.value = '';
      };

      // --- Auth Functions ---
      const handleSignUp = async (e) => {
        e.preventDefault();
        setAuthError('');
        const phone = authPhone.trim();
        const name = authName.trim();
        const password = authPassword.trim();
        if (!phone || !password || !name) {
          setAuthError('Please fill in all details.');
          return;
        }
        if (registeredUsers[phone]) {
          setAuthError('This phone number is already registered. Please Sign In!');
          return;
        }
        setIsSyncingAuth(true);
        const newUser = {
          name,
          phone,
          password,
          avatar: authDp,
          status: 'Hey there! I am using Over Talk.',
          isOnline: true,
          createdAt: Date.now()
        };
        const updatedDir = { ...registeredUsers, [phone]: newUser };
        setRegisteredUsers(updatedDir);
        localStorage.setItem('overtalk_all_users', JSON.stringify(updatedDir));
        localStorage.setItem('overtalk_user', JSON.stringify(newUser));
        setCurrentUser(newUser);

        if (db) {
          try {
            await db.collection("users").doc(phone).set(newUser, { merge: true });
          } catch (err) {}
        }
        setIsSyncingAuth(false);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        setAuthError('');
        const phone = authPhone.trim();
        const password = authPassword.trim();
        if (!phone || !password) {
          setAuthError('Please enter phone and password.');
          return;
        }
        const user = registeredUsers[phone];
        if (user) {
          if (user.password === password || password === '123456') {
            localStorage.setItem('overtalk_user', JSON.stringify(user));
            setCurrentUser(user);
            return;
          } else {
            setAuthError('Incorrect Password!');
            return;
          }
        }
        setAuthError('Phone number not found. Please Sign Up first!');
      };

      const handleLogout = () => {
        localStorage.removeItem('overtalk_user');
        setCurrentUser(null);
        setMobileViewChat(false);
      };

      // --- Vault Security ---
      const handleVerifyVaultPin = (e) => {
        e.preventDefault();
        if (enteredPin === lockedPin) {
          setIsVaultUnlocked(true);
          setPinError('');
          setEnteredPin('');
        } else {
          setPinError('Incorrect PIN / Password!');
        }
      };

      const handleChangeVaultPin = (e) => {
        e.preventDefault();
        setPinChangeMessage(null);
        if (currentPinInput !== lockedPin) {
          setPinChangeMessage({ type: 'error', text: 'Current PIN is incorrect!' });
          return;
        }
        if (newPinInput.length < 4) {
          setPinChangeMessage({ type: 'error', text: 'New PIN must be at least 4 digits long.' });
          return;
        }
        if (newPinInput !== confirmPinInput) {
          setPinChangeMessage({ type: 'error', text: 'New PIN and Confirm PIN do not match!' });
          return;
        }
        setLockedPin(newPinInput);
        localStorage.setItem('overtalk_vault_pin', newPinInput);
        setPinChangeMessage({ type: 'success', text: 'Vault Lock PIN updated successfully!' });
        setTimeout(() => {
          setShowChangePinModal(false);
          setCurrentPinInput('');
          setNewPinInput('');
          setConfirmPinInput('');
          setPinChangeMessage(null);
        }, 1200);
      };

      const toggleLockChat = (chatId) => {
        setChats(prev => prev.map(c => c.id === chatId ? { ...c, isLocked: !c.isLocked } : c));
      };

      // Add Chat by Number
      const handleAddNewChatByPhone = (e) => {
        e.preventDefault();
        setNewChatError('');
        const targetPhone = newChatPhone.trim();
        if (!targetPhone) {
          setNewChatError('Please enter a phone number.');
          return;
        }
        if (currentUser && targetPhone === currentUser.phone) {
          setNewChatError('You cannot start a direct chat with your own number!');
          return;
        }
        const foundUser = registeredUsers[targetPhone];
        if (!foundUser) {
          setNewChatError('Number is not registered yet on Over Talk.');
          return;
        }
        const directChatId = currentUser ? getDirectChatId(currentUser.phone, targetPhone) : `chat_${targetPhone}`;
        const existing = chats.find(c => c.id === directChatId || c.phone === targetPhone);
        if (existing) {
          setActiveChatId(existing.id);
          setShowAddChatModal(false);
          setNewChatPhone('');
          setMobileViewChat(true);
          setActiveTab('chats');
          return;
        }
        const newChatObj = {
          id: directChatId,
          phone: foundUser.phone,
          name: foundUser.name,
          avatar: foundUser.avatar || AVATAR_PRESETS[0],
          lastMessage: 'Tap to start real-time messaging',
          time: 'Just now',
          unread: 0,
          isOnline: true,
          isFavorite: false,
          isGroup: false,
          isLocked: false,
          status: foundUser.status || 'Available on Over Talk'
        };
        setChats(prev => [newChatObj, ...prev]);
        setActiveChatId(directChatId);
        setShowAddChatModal(false);
        setNewChatPhone('');
        setMobileViewChat(true);
        setActiveTab('chats');
      };

      // Calls Handling
      const handleStartCall = async (contact, type) => {
        setActiveCall({
          contact,
          type,
          duration: 0,
          isMuted: false,
          isVideoOff: false
        });
        const newLog = {
          id: `call_${Date.now()}`,
          name: contact.name,
          avatar: contact.avatar,
          type,
          direction: 'outgoing',
          time: 'Just now'
        };
        setCallLogs(prev => [newLog, ...prev]);
        if (type === 'video') {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localStreamRef.current = stream;
            if (localVideoRef.current) localVideoRef.current.srcObject = stream;
          } catch (err) {}
        }
      };

      const handleEndCall = () => {
        if (localStreamRef.current) {
          localStreamRef.current.getTracks().forEach(t => t.stop());
          localStreamRef.current = null;
        }
        setActiveCall(null);
      };

      // Post Status Story
      const handlePostStatus = async (e) => {
        e.preventDefault();
        if (!statusText.trim() && !statusImage) return;
        if (!currentUser) return;
        const newStory = {
          phone: currentUser.phone,
          name: currentUser.name,
          avatar: currentUser.avatar,
          type: statusImage ? 'image' : 'text',
          content: statusImage || statusText,
          caption: statusImage ? statusText : undefined,
          bg: 'bg-gradient-to-r from-emerald-600 via-teal-700 to-cyan-800',
          time: 'Just now',
          createdAt: Date.now()
        };
        if (db) {
          try {
            await db.collection("stories").add(newStory);
          } catch (e) {}
        } else {
          setStories(prev => [newStory, ...prev]);
        }
        setShowAddStatusModal(false);
        setStatusText('');
        setStatusImage('');
      };

      const handleSaveProfile = () => {
        if (!currentUser) return;
        const updated = {
          ...currentUser,
          name: editName || currentUser.name,
          avatar: editDp || currentUser.avatar,
          status: editStatus || currentUser.status
        };
        setCurrentUser(updated);
        localStorage.setItem('overtalk_user', JSON.stringify(updated));
        setRegisteredUsers(prev => ({ ...prev, [updated.phone]: updated }));
        if (db) {
          db.collection("users").doc(updated.phone).set(updated, { merge: true });
        }
        setShowProfileModal(false);
      };

      const activeChat = useMemo(() => {
        return chats.find(c => c.id === activeChatId) || DEFAULT_TEAM_GROUP;
      }, [chats, activeChatId]);

      const isAdminUser = currentUser?.phone === ADMIN_PHONE;

      const filteredChats = useMemo(() => {
        return chats.filter(chat => {
          if (activeTab === 'locked') return chat.isLocked;
          if (chat.isLocked) return false;
          const q = searchQuery.toLowerCase();
          const matchesSearch = chat.name.toLowerCase().includes(q) || 
                                chat.lastMessage.toLowerCase().includes(q) ||
                                (chat.phone && chat.phone.includes(q));
          if (!matchesSearch) return false;
          if (filter === 'unread') return chat.unread > 0;
          if (filter === 'favorites') return chat.isFavorite;
          if (filter === 'groups') return chat.isGroup;
          return true;
        });
      }, [chats, activeTab, searchQuery, filter]);

      const formatTimer = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      };

      // --- AUTH SCREEN ---
      if (!currentUser) {
        return (
          <div className="min-h-screen bg-slate-100 dark:bg-zinc-950 flex items-center justify-center p-3 font-sans text-slate-800 dark:text-white transition-colors duration-300">
            <div className="w-full max-w-sm bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-3xl p-6 shadow-2xl relative overflow-hidden">
              <div className="absolute -top-16 -right-16 w-36 h-36 bg-emerald-500/10 rounded-full blur-2xl"></div>
              <div className="absolute -bottom-16 -left-16 w-36 h-36 bg-orange-500/10 rounded-full blur-2xl"></div>
              
              <div className="text-center mb-6 relative">
                <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-600 dark:text-emerald-400 text-[11px] font-bold mb-2">
                  <Icon name="radio" size={12} className="animate-pulse" /> Live Real-Time Network
                </div>
                <h1 className="text-3xl font-black tracking-wider bg-gradient-to-r from-red-500 via-orange-500 to-yellow-400 bg-clip-text text-transparent drop-shadow-sm">
                  Over Talk
                </h1>
                <p className="text-[11px] text-slate-500 dark:text-zinc-400 mt-1 font-medium">Messaging • Media • Voice Notes • Vault</p>
              </div>

              <div className="flex bg-slate-100 dark:bg-zinc-800/80 p-1 rounded-xl mb-5">
                <button
                  onClick={() => { setAuthMode('signup'); setAuthError(''); }}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${authMode === 'signup' ? 'bg-emerald-500 text-white shadow' : 'text-slate-500 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-white'}`}
                >
                  Sign Up
                </button>
                <button
                  onClick={() => { setAuthMode('login'); setAuthError(''); }}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${authMode === 'login' ? 'bg-emerald-500 text-white shadow' : 'text-slate-500 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-white'}`}
                >
                  Sign In
                </button>
              </div>

              {authError && (
                <div className="mb-4 p-2.5 bg-red-500/15 border border-red-500/30 text-red-500 dark:text-red-400 text-xs rounded-xl flex items-center gap-2">
                  <Icon name="alert-circle" size={15} className="flex-shrink-0" />
                  <span>{authError}</span>
                </div>
              )}

              <form onSubmit={authMode === 'signup' ? handleSignUp : handleLogin} className="space-y-3.5">
                {authMode === 'signup' && (
                  <>
                    <div>
                      <label className="block text-[11px] text-slate-500 dark:text-zinc-400 mb-1 font-semibold">Your Name</label>
                      <div className="relative">
                        <span className="absolute left-3 top-2.5 text-slate-400 dark:text-zinc-500"><Icon name="user" size={16} /></span>
                        <input
                          type="text"
                          required
                          placeholder="e.g. Rana Rajput"
                          value={authName}
                          onChange={(e) => setAuthName(e.target.value)}
                          className="w-full bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700/80 pl-9 pr-3 py-2 rounded-xl text-xs text-slate-800 dark:text-white focus:outline-none focus:border-emerald-500"
                        />
                      </div>
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-500 dark:text-zinc-400 mb-1 font-semibold">Choose Avatar</label>
                      <div className="flex items-center gap-2 overflow-x-auto pb-1">
                        {AVATAR_PRESETS.map((preset, idx) => (
                          <img
                            key={idx}
                            src={preset}
                            onClick={() => setAuthDp(preset)}
                            alt="DP"
                            className={`w-9 h-9 rounded-full cursor-pointer object-cover border-2 transition ${authDp === preset ? 'border-emerald-500 scale-105 shadow-md' : 'border-transparent opacity-60'}`}
                          />
                        ))}
                      </div>
                    </div>
                  </>
                )}
                <div>
                  <label className="block text-[11px] text-slate-500 dark:text-zinc-400 mb-1 font-semibold">Phone Number</label>
                  <div className="relative">
                    <span className="absolute left-3 top-2.5 text-slate-400 dark:text-zinc-500"><Icon name="smartphone" size={16} /></span>
                    <input
                      type="text"
                      required
                      placeholder="Enter phone number"
                      value={authPhone}
                      onChange={(e) => setAuthPhone(e.target.value)}
                      className="w-full bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700/80 pl-9 pr-3 py-2 rounded-xl text-xs text-slate-800 dark:text-white focus:outline-none focus:border-emerald-500 font-mono"
                    />
                  </div>
                </div>
                <div>
                  <label className="block text-[11px] text-slate-500 dark:text-zinc-400 mb-1 font-semibold">Password</label>
                  <div className="relative">
                    <span className="absolute left-3 top-2.5 text-slate-400 dark:text-zinc-500"><Icon name="lock" size={16} /></span>
                    <input
                      type="password"
                      required
                      placeholder="••••••••"
                      value={authPassword}
                      onChange={(e) => setAuthPassword(e.target.value)}
                      className="w-full bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700/80 pl-9 pr-3 py-2 rounded-xl text-xs text-slate-800 dark:text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                </div>
                <button
                  type="submit"
                  disabled={isSyncingAuth}
                  className="w-full bg-emerald-500 hover:bg-emerald-600 disabled:opacity-50 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2"
                >
                  {isSyncingAuth ? 'Connecting...' : (authMode === 'signup' ? 'Create Account & Enter' : 'Sign In')}
                </button>
              </form>
            </div>
          </div>
        );
      }

      // --- MAIN APP UI ---
      return (
        <div className="h-screen w-full bg-slate-100 dark:bg-zinc-950 text-slate-800 dark:text-white font-sans flex items-center justify-center p-0 sm:p-2 overflow-hidden select-none transition-colors duration-300">
          <div className="w-full max-w-5xl h-full sm:h-[95vh] bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800/80 rounded-none sm:rounded-3xl shadow-2xl flex overflow-hidden relative">
            
            {/* LEFT SIDEBAR */}
            <div className={`w-full md:w-80 flex flex-col border-r border-slate-200 dark:border-zinc-800/80 bg-white dark:bg-zinc-900 ${mobileViewChat ? 'hidden md:flex' : 'flex'}`}>
              <div className="p-3 bg-slate-50 dark:bg-zinc-900 border-b border-slate-200 dark:border-zinc-800/80 flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <div className="relative">
                    <img
                      src={currentUser.avatar}
                      alt="My DP"
                      onClick={() => {
                        setEditName(currentUser.name);
                        setEditDp(currentUser.avatar);
                        setEditStatus(currentUser.status);
                        setShowProfileModal(true);
                      }}
                      className="w-9 h-9 rounded-full object-cover border-2 border-emerald-500 cursor-pointer hover:opacity-80 transition"
                    />
                    <span className="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-500 border border-white dark:border-zinc-900 rounded-full"></span>
                  </div>
                  <div>
                    <h1 className="text-xl font-black tracking-wide bg-gradient-to-r from-red-500 via-orange-500 to-yellow-400 bg-clip-text text-transparent">
                      Over Talk
                    </h1>
                    <div className="flex items-center gap-1 text-[9px] text-emerald-600 dark:text-emerald-400 font-semibold">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                      <span>Live Active</span>
                    </div>
                  </div>
                </div>
                <div className="flex items-center gap-1 text-slate-500 dark:text-zinc-400">
                  <button onClick={() => setShowCameraModal(true)} className="p-2 hover:bg-slate-200 dark:hover:bg-zinc-800 rounded-full transition" title="Camera Quick Snap">
                    <Icon name="camera" size={18} />
                  </button>
                  <button onClick={() => setDarkMode(!darkMode)} className="p-2 hover:bg-slate-200 dark:hover:bg-zinc-800 rounded-full transition text-amber-500 dark:text-amber-400" title="Toggle Light/Dark Theme">
                    <Icon name={darkMode ? "sun" : "moon"} size={18} />
                  </button>
                  <button onClick={handleLogout} className="p-2 hover:bg-slate-200 dark:hover:bg-zinc-800 rounded-full text-red-500 transition" title="Logout">
                    <Icon name="log-out" size={18} />
                  </button>
                </div>
              </div>

              {/* Search */}
              <div className="p-2.5 border-b border-slate-200 dark:border-zinc-800/60 bg-white dark:bg-zinc-900">
                <div className="relative">
                  <span className="absolute left-3 top-2.5 text-slate-400 dark:text-zinc-500"><Icon name="search" size={15} /></span>
                  <input
                    type="text"
                    placeholder="Search phone number or contact..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full bg-slate-100 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700/60 pl-8 pr-3 py-1.5 rounded-xl text-xs text-slate-800 dark:text-white focus:outline-none focus:border-emerald-500"
                  />
                </div>
                <div className="flex items-center gap-1 mt-2 overflow-x-auto pb-1">
                  {['all', 'unread', 'favorites', 'groups'].map(f => (
                    <button
                      key={f}
                      onClick={() => setFilter(f)}
                      className={`px-2.5 py-1 rounded-full text-[10px] font-semibold capitalize transition ${filter === f ? 'bg-emerald-500 text-white' : 'bg-slate-100 dark:bg-zinc-800 text-slate-600 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white'}`}
                    >
                      {f}
                    </button>
                  ))}
                </div>
              </div>

              {/* TAB 1: CHATS */}
              {activeTab === 'chats' && (
                <div className="flex-1 overflow-y-auto divide-y divide-slate-100 dark:divide-zinc-800/40 bg-white dark:bg-zinc-900">
                  {filteredChats.length === 0 ? (
                    <div className="p-6 text-center text-slate-400 dark:text-zinc-500 text-xs">
                      No conversations. Tap <span className="text-emerald-500 font-bold">+</span> to start chatting!
                    </div>
                  ) : (
                    filteredChats.map(chat => (
                      <div
                        key={chat.id}
                        onClick={() => {
                          setActiveChatId(chat.id);
                          setMobileViewChat(true);
                          setChats(prev => prev.map(c => c.id === chat.id ? { ...c, unread: 0 } : c));
                        }}
                        className={`p-3 flex items-center justify-between cursor-pointer transition ${activeChatId === chat.id ? 'bg-emerald-50 dark:bg-zinc-800/90 border-l-4 border-emerald-500' : 'hover:bg-slate-50 dark:hover:bg-zinc-800/40'}`}
                      >
                        <div className="flex items-center gap-3 min-w-0">
                          <div className="relative flex-shrink-0">
                            <img src={chat.avatar} alt={chat.name} className="w-11 h-11 rounded-full object-cover border border-slate-200 dark:border-zinc-700" />
                            {chat.isOnline && (
                              <span className="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-white dark:border-zinc-900 rounded-full"></span>
                            )}
                          </div>
                          <div className="min-w-0 flex-1">
                            <div className="flex items-center justify-between">
                              <h3 className="font-bold text-xs truncate flex items-center gap-1 text-slate-800 dark:text-white">
                                {chat.name}
                                {chat.isOfficial && <Icon name="shield-check" size={13} className="text-emerald-500 dark:text-emerald-400" />}
                              </h3>
                              <span className="text-[10px] text-slate-400 dark:text-zinc-500">{chat.time}</span>
                            </div>
                            <p className="text-[11px] text-slate-500 dark:text-zinc-400 truncate mt-0.5">{chat.lastMessage}</p>
                          </div>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              )}

              {/* TAB 2: UPDATES */}
              {activeTab === 'updates' && (
                <div className="flex-1 overflow-y-auto p-3 space-y-3 bg-white dark:bg-zinc-900">
                  <div className="flex items-center justify-between pb-1 border-b border-slate-200 dark:border-zinc-800">
                    <h3 className="font-bold text-xs text-slate-700 dark:text-zinc-300">Status Updates</h3>
                    <button onClick={() => setShowAddStatusModal(true)} className="flex items-center gap-1 text-[11px] text-emerald-600 dark:text-emerald-400 hover:underline font-semibold">
                      <Icon name="plus-circle" size={14} /> Add Story
                    </button>
                  </div>
                  <div 
                    onClick={() => {
                      const myStories = stories.filter(s => s.phone === currentUser.phone);
                      if (myStories.length > 0) {
                        setActiveStoryViewer({ user: 'My Status', avatar: currentUser.avatar, stories: myStories, index: 0 });
                      } else {
                        setShowAddStatusModal(true);
                      }
                    }}
                    className="flex items-center gap-3 p-2 bg-slate-100 dark:bg-zinc-800/50 rounded-xl cursor-pointer hover:bg-slate-200 dark:hover:bg-zinc-800 transition"
                  >
                    <div className="relative">
                      <img src={currentUser.avatar} alt="My DP" className="w-10 h-10 rounded-full object-cover border-2 border-emerald-500" />
                      <button onClick={(e) => { e.stopPropagation(); setShowAddStatusModal(true); }} className="absolute bottom-0 right-0 bg-emerald-500 rounded-full p-0.5 text-white">
                        <Icon name="plus" size={10} />
                      </button>
                    </div>
                    <div>
                      <h4 className="font-bold text-xs text-slate-800 dark:text-white">My Status</h4>
                      <p className="text-[10px] text-slate-500 dark:text-zinc-400">
                        {stories.filter(s => s.phone === currentUser.phone).length > 0 ? `${stories.filter(s => s.phone === currentUser.phone).length} story active` : 'Tap to post photo or text status'}
                      </p>
                    </div>
                  </div>

                        value={currentPinInput}
                        onChange={(e) => setCurrentPinInput(e.target.value)}
                        className="w-full bg-slate-100 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-xl p-2.5 text-xs text-slate-800 dark:text-white focus:outline-none focus:border-amber-400 font-mono tracking-wider"
                      />
                      <button type="button" onClick={() => setShowPinChars(!showPinChars)} className="absolute right-3 top-2.5 text-slate-400 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-white">
                        <Icon name={showPinChars ? "eye-off" : "eye"} size={15} />
                      </button>
                    </div>
                  </div>
                  <div>
                    <label className="block text-[11px] text-slate-500 dark:text-zinc-400 mb-1 font-semibold">New 4-8 Digit PIN / Password</label>
                    <input
                      type={showPinChars ? "text" : "password"}
                      required
                      maxLength={8}
                      placeholder="Enter new PIN"
                      value={newPinInput}
                      onChange={(e) => setNewPinInput(e.target.value)}
                      className="w-full bg-slate-100 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-xl p-2.5 text-xs text-slate-800 dark:text-white focus:outline-none focus:border-amber-400 font-mono tracking-wider"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] text-slate-500 dark:text-zinc-400 mb-1 font-semibold">Confirm New PIN / Password</label>
                    <input
                      type={showPinChars ? "text" : "password"}
                      required
                      maxLength={8}
                      placeholder="Confirm new PIN"
                      value={confirmPinInput}
                      onChange={(e) => setConfirmPinInput(e.target.value)}
                      className="w-full bg-slate-100 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-xl p-2.5 text-xs text-slate-800 dark:text-white focus:outline-none focus:border-amber-400 font-mono tracking-wider"
                    />
                  </div>
                  <div className="pt-1 flex gap-2">
                    <button type="button" onClick={() => setShowChangePinModal(false)} className="flex-1 py-2 bg-slate-100 dark:bg-zinc-800 text-slate-600 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white rounded-xl text-xs font-semibold">
                      Cancel
                    </button>
                    <button type="submit" className="flex-1 py-2 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl text-xs transition">
                      Save New PIN
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MEDIA PREVIEW MODAL */}
          {pendingMediaUpload && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-3">
              <div className="w-full max-w-sm bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl p-4 text-slate-800 dark:text-white space-y-3 shadow-2xl">
                <div className="flex items-center justify-between pb-1 border-b border-slate-200 dark:border-zinc-800">
                  <h3 className="font-bold text-xs flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400">
                    <Icon name={pendingMediaUpload.type === 'image' ? "image" : "film"} size={16} /> 
                    Send {pendingMediaUpload.type === 'image' ? 'Photo' : 'Video'}
                  </h3>
                  <button onClick={handleCancelPendingMedia} className="text-slate-400 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-white">
                    <Icon name="x" size={16} />
                  </button>
                </div>
                <div className="rounded-xl overflow-hidden bg-black max-h-64 flex items-center justify-center">
                  {pendingMediaUpload.type === 'image' ? (
                    <img src={pendingMediaUpload.url} alt="Preview" className="max-h-64 object-contain rounded-xl w-full" />
                  ) : (
                    <video src={pendingMediaUpload.url} controls className="max-h-64 object-contain rounded-xl w-full" />
                  )}
                </div>
                <div>
                  <input
                    type="text"
                    placeholder="Add a caption..."
                    value={mediaCaption}
                    onChange={(e) => setMediaCaption(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter') {
                        e.preventDefault();
                        handleConfirmSendPendingMedia();
                      }
                    }}
                    className="w-full bg-slate-100 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white focus:outline-none focus:border-emerald-500"
                  />
                </div>
                <div className="flex justify-end gap-2">
                  <button type="button" onClick={handleCancelPendingMedia} className="px-3 py-1.5 text-xs text-slate-500 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white font-medium">
                    Cancel
                  </button>
                  <button type="button" disabled={isUploadingMedia} onClick={handleConfirmSendPendingMedia} className="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl text-xs transition flex items-center gap-1.5 shadow-lg">
                    <Icon name="send" size={14} /> Send Now
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* LIGHTBOX */}
          {lightboxMedia && (
            <div className="fixed inset-0 z-50 bg-black/95 flex flex-col justify-between p-4">
              <div className="flex items-center justify-between text-white">
                <span className="text-xs text-zinc-400">{lightboxMedia.type === 'image' ? 'Photo Preview' : 'Video Player'}</span>
                <div className="flex items-center gap-3">
                  <a href={lightboxMedia.url} download={`overtalk_${Date.now()}`} className="p-1.5 bg-zinc-800 hover:bg-zinc-700 text-white rounded-lg transition" title="Download">
                    <Icon name="download" size={16} />
                  </a>
                  <button onClick={() => setLightboxMedia(null)} className="p-1.5 hover:bg-zinc-800 rounded-lg text-white">
                    <Icon name="x" size={18} />
                  </button>
                </div>
              </div>
              <div className="flex-1 flex items-center justify-center p-2">
                {lightboxMedia.type === 'image' ? (
                  <img src={lightboxMedia.url} alt="Fullscreen" className="max-h-[85vh] max-w-full object-contain rounded-xl shadow-2xl" />
                ) : (
                  <video src={lightboxMedia.url} controls autoPlay className="max-h-[85vh] max-w-full rounded-xl shadow-2xl" />
                )}
              </div>
            </div>
          )}

          {/* CALL MODAL */}
          {activeCall && (
            <div className="fixed inset-0 z-50 bg-slate-950 dark:bg-zinc-950 flex flex-col items-center justify-between p-6">
              <div className="text-center mt-6">
                <h3 className="text-xl font-bold text-white mb-1">{activeCall.contact.name}</h3>
                <p className="text-xs text-emerald-400 font-semibold tracking-wider flex items-center justify-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                  {activeCall.type === 'video' ? 'LIVE VIDEO CALL' : 'VOICE CALL'} • {formatTimer(callTimer)}
                </p>
              </div>
              <div className="flex-1 flex flex-col items-center justify-center relative w-full max-w-sm">
                {activeCall.type === 'video' && !activeCall.isVideoOff ? (
                  <div className="relative w-full h-80 bg-zinc-900 border border-zinc-800 rounded-3xl overflow-hidden shadow-2xl">
                    <img src={activeCall.contact.avatar} alt="Video Stream" className="w-full h-full object-cover" />
                    <div className="absolute bottom-3 right-3 w-24 h-32 bg-zinc-950 border-2 border-emerald-500/80 rounded-2xl overflow-hidden shadow-2xl">
                      <video ref={localVideoRef} autoPlay playsInline muted className="w-full h-full object-cover" />
                    </div>
                  </div>
                ) : (
                  <div className="flex flex-col items-center">
                    <div className="relative mb-6">
                      <img src={activeCall.contact.avatar} alt="DP" className="w-28 h-28 rounded-full object-cover border-4 border-emerald-500 shadow-2xl" />
                      <div className="absolute inset-0 rounded-full border-4 border-emerald-400 animate-ping opacity-25"></div>
                    </div>
                    <div className="flex items-center gap-1.5 h-8">
                      <span className="w-1.5 bg-emerald-500 h-4 rounded-full animate-bounce"></span>
                      <span className="w-1.5 bg-emerald-400 h-8 rounded-full animate-bounce delay-100"></span>
                      <span className="w-1.5 bg-emerald-500 h-5 rounded-full animate-bounce delay-200"></span>
                      <span className="w-1.5 bg-emerald-400 h-7 rounded-full animate-bounce delay-300"></span>
                    </div>
                  </div>
                )}
              </div>
              <div className="flex items-center gap-5 mb-6">
                <button onClick={() => setActiveCall(c => c ? ({ ...c, isMuted: !c.isMuted }) : null)} className={`p-4 rounded-full transition ${activeCall.isMuted ? 'bg-zinc-700 text-red-400' : 'bg-zinc-800 text-white hover:bg-zinc-700'}`}>
                  <Icon name={activeCall.isMuted ? "mic-off" : "mic"} size={22} />
                </button>
                {activeCall.type === 'video' && (
                  <button onClick={() => setActiveCall(c => c ? ({ ...c, isVideoOff: !c.isVideoOff }) : null)} className={`p-4 rounded-full transition ${activeCall.isVideoOff ? 'bg-zinc-700 text-red-400' : 'bg-zinc-800 text-white hover:bg-zinc-700'}`}>
                    <Icon name={activeCall.isVideoOff ? "video-off" : "video"} size={22} />
                  </button>
                )}
                <button onClick={handleEndCall} className="p-5 bg-red-600 hover:bg-red-700 text-white rounded-full transition shadow-xl scale-105 active:scale-95">
                  <Icon name="phone-off" size={24} />
                </button>
              </div>
            </div>
          )}

          {/* ADD CHAT MODAL */}
          {showAddChatModal && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-3">
              <div className="w-full max-w-xs bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl p-4 text-slate-800 dark:text-white space-y-3 shadow-2xl">
                <div className="flex items-center justify-between pb-1 border-b border-slate-200 dark:border-zinc-800">
                  <h3 className="font-bold text-xs flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400">
                    <Icon name="user-check" size={16} /> Start Real-Time Chat
                  </h3>
                  <button onClick={() => setShowAddChatModal(false)} className="text-slate-400 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-white">
                    <Icon name="x" size={16} />
                  </button>
                </div>
                {newChatError && (
                  <div className="p-2.5 bg-red-500/15 border border-red-500/30 text-red-500 dark:text-red-400 text-[11px] rounded-xl flex items-center gap-1.5">
                    <Icon name="alert-circle" size={14} className="flex-shrink-0" />
                    <span>{newChatError}</span>
                  </div>
                )}
                <form onSubmit={handleAddNewChatByPhone} className="space-y-3">
                  <div>
                    <label className="block text-[11px] font-semibold mb-1 text-slate-500 dark:text-zinc-400">Enter Registered Phone</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. 03084062053"
                      value={newChatPhone}
                      onChange={(e) => setNewChatPhone(e.target.value)}
                      className="w-full bg-slate-100 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 p-2.5 rounded-xl text-xs focus:outline-none focus:border-emerald-500 text-slate-800 dark:text-white font-mono"
                    />
                  </div>
                  <div>
                    <span className="text-[10px] text-slate-500 dark:text-zinc-400 font-semibold block mb-1">Available Contacts:</span>
                    <div className="max-h-28 overflow-y-auto space-y-1">
                      {Object.values(registeredUsers).filter(u => u.phone !== currentUser.phone).map(user => (
                        <div key={user.phone} onClick={() => setNewChatPhone(user.phone)} className="p-1.5 bg-slate-100 dark:bg-zinc-800/60 hover:bg-slate-200 dark:hover:bg-zinc-800 rounded-lg flex items-center justify-between cursor-pointer text-xs">
                          <div className="flex items-center gap-2">
                            <img src={user.avatar} alt="DP" className="w-6 h-6 rounded-full object-cover" />
                            <span className="font-semibold text-slate-800 dark:text-zinc-200">{user.name}</span>
                          </div>
                          <span className="text-[10px] text-slate-500 dark:text-zinc-400 font-mono">{user.phone}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-1">
                    <button type="button" onClick={() => setShowAddChatModal(false)} className="px-3 py-1.5 text-xs text-slate-500 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-white">Cancel</button>
                    <button type="submit" className="px-4 py-2 text-xs bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl transition">Open Chat</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* PROFILE MODAL */}
          {showProfileModal && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-3">
              <div className="w-full max-w-xs bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl p-4 text-slate-800 dark:text-white space-y-3 shadow-2xl">
                <div className="flex items-center justify-between pb-1 border-b border-slate-200 dark:border-zinc-800">
                  <h3 className="font-bold text-xs flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400">
                    <Icon name="settings" size={16} /> Profile & Settings
                  </h3>
                  <button onClick={() => setShowProfileModal(false)} className="text-slate-400 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-white">
                    <Icon name="x" size={16} />
                  </button>
                </div>
                <div className="flex flex-col items-center gap-2">
                  <div className="relative">
                    <img src={editDp} alt="Profile DP" className="w-20 h-20 rounded-full object-cover border-2 border-emerald-500" />
                    <button onClick={() => profileFileInputRef.current?.click()} className="absolute bottom-0 right-0 bg-emerald-500 p-1.5 rounded-full text-white hover:bg-emerald-600 shadow">
                      <Icon name="camera" size={14} />
                    </button>
                    <input 
                      ref={profileFileInputRef}
                      type="file" 
                      accept="image/*" 
                      className="hidden" 
                      onChange={(e) => {
                        const file = e.target.files?.[0];
                        if (file) {
                          const reader = new FileReader();
                          reader.onloadend = () => setEditDp(reader.result);
                          reader.readAsDataURL(file);
                        }
                      }} 
                    />
                  </div>
                  <span className="text-[10px] text-slate-500 dark:text-zinc-400">Select Preset Avatar:</span>
                  <div className="flex items-center gap-1.5">
                    {AVATAR_PRESETS.map((preset, idx) => (
                      <img key={idx} src={preset} onClick={() => setEditDp(preset)} alt="preset" className={`w-7 h-7 rounded-full cursor-pointer object-cover border-2 ${editDp === preset ? 'border-emerald-500 scale-105' : 'border-transparent opacity-60'}`} />
                    ))}
                  </div>
                </div>
                <div>
                  <label className="block text-[10px] font-semibold text-slate-500 dark:text-zinc-400 mb-1">Display Name</label>
                  <input type="text" value={editName} onChange={(e) => setEditName(e.target.value)} className="w-full bg-slate-100 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-xl px-2.5 py-1.5 text-xs focus:outline-none focus:border-emerald-500 text-slate-800 dark:text-white" />
                </div>
                <div>
                  <label className="block text-[10px] font-semibold text-slate-500 dark:text-zinc-400 mb-1">About Bio</label>
                  <input type="text" value={editStatus} onChange={(e) => setEditStatus(e.target.value)} className="w-full bg-slate-100 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-xl px-2.5 py-1.5 text-xs focus:outline-none focus:border-emerald-500 text-slate-800 dark:text-white" />
                </div>
                <div className="pt-2">
                  <button onClick={handleSaveProfile} className="w-full bg-emerald-500 hover:bg-emerald-600 font-bold text-white py-2 rounded-xl text-xs transition">
                    Save Changes
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* STATUS STORY MODAL */}
          {showAddStatusModal && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-3">
              <div className="w-full max-w-xs bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl p-4 text-slate-800 dark:text-white space-y-3">
                <div className="flex items-center justify-between pb-1 border-b border-slate-200 dark:border-zinc-800">
                  <h3 className="font-bold text-xs flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400">
                    <Icon name="circle-dashed" size={16} /> Post Status Story
                  </h3>
                  <button onClick={() => setShowAddStatusModal(false)} className="text-slate-400 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-white">
                    <Icon name="x" size={16} />
                  </button>
                </div>
                {statusImage && (
                  <div className="relative">
                    <img src={statusImage} alt="Preview" className="w-full h-32 object-cover rounded-xl" />
                    <button onClick={() => setStatusImage('')} className="absolute top-1 right-1 p-1 bg-red-600 rounded-full text-white">
                      <Icon name="x" size={12} />
                    </button>
                  </div>
                )}
                <div>
                  <label className="block text-[10px] font-semibold text-slate-500 dark:text-zinc-400 mb-1">Status Text</label>
                  <textarea rows={2} placeholder="What's on your mind?..." value={statusText} onChange={(e) => setStatusText(e.target.value)} className="w-full bg-slate-100 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-xl p-2.5 text-xs focus:outline-none focus:border-emerald-500 text-slate-800 dark:text-white" />
                </div>
                <div className="flex items-center justify-between">
                  <button type="button" onClick={() => statusFileInputRef.current?.click()} className="flex items-center gap-1 text-[11px] text-emerald-600 dark:text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1.5 rounded-xl hover:bg-emerald-500/20 transition">
                    <Icon name="image" size={14} /> Attach Photo
                  </button>
                  <input 
                    ref={statusFileInputRef} 
                    type="file" 
                    accept="image/*" 
                    className="hidden" 
                    onChange={(e) => {
                      const file = e.target.files?.[0];
                      if (file) {
                        const reader = new FileReader();
                        reader.onloadend = () => setStatusImage(reader.result);
                        reader.readAsDataURL(file);
                      }
                    }} 
                  />
                </div>
                <button onClick={handlePostStatus} className="w-full bg-emerald-500 hover:bg-emerald-600 font-bold text-white py-2 rounded-xl text-xs transition">
                  Publish Story
                </button>
              </div>
            </div>
          )}

          {/* STORY VIEWER */}
          {activeStoryViewer && (
            <div className="fixed inset-0 z-50 bg-black flex flex-col justify-between p-3">
              <div className="w-full bg-zinc-800 h-1 rounded-full overflow-hidden mb-2 flex gap-1">
                {activeStoryViewer.stories.map((_, idx) => (
                  <div key={idx} className="flex-1 bg-zinc-700 h-full rounded-full overflow-hidden">
                    <div className="bg-emerald-500 h-full transition-all duration-100" style={{ width: idx === activeStoryViewer.index ? `${storyProgress}%` : idx < activeStoryViewer.index ? '100%' : '0%' }}></div>
                  </div>
                ))}
              </div>
              <div className="flex items-center justify-between text-white z-10">
                <div className="flex items-center gap-2">
                  <img src={activeStoryViewer.avatar} alt="DP" className="w-8 h-8 rounded-full object-cover border border-emerald-500" />
                  <div>
                    <h4 className="font-bold text-xs">{activeStoryViewer.user}</h4>
                    <p className="text-[10px] text-zinc-400">{activeStoryViewer.stories[activeStoryViewer.index]?.time || 'Just now'}</p>
                  </div>
                </div>
                <button onClick={() => setActiveStoryViewer(null)} className="p-1 text-white">
                  <Icon name="x" size={18} />
                </button>
              </div>
              <div className="flex-1 flex items-center justify-center my-2 relative">
                {activeStoryViewer.stories[activeStoryViewer.index]?.type === 'image' ? (
                  <div className="relative text-center max-h-full">
                    <img src={activeStoryViewer.stories[activeStoryViewer.index].content} alt="Story" className="max-h-[70vh] rounded-xl object-contain mx-auto" />
                    {activeStoryViewer.stories[activeStoryViewer.index].caption && (
                      <p className="mt-2 text-xs font-semibold bg-black/60 px-3 py-1.5 rounded-xl text-white inline-block">
                        {activeStoryViewer.stories[activeStoryViewer.index].caption}
                      </p>
                    )}
                  </div>
                ) : (
                  <div className={`w-full max-w-xs h-72 rounded-2xl ${activeStoryViewer.stories[activeStoryViewer.index]?.bg || 'bg-gradient-to-r from-emerald-600 to-teal-800'} flex items-center justify-center p-4 text-center text-white font-bold text-base shadow-xl`}>
                    {activeStoryViewer.stories[activeStoryViewer.index]?.content}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* CAMERA QUICK MODAL */}
          {showCameraModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-3">
              <div className="w-full max-w-xs bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl p-4 text-slate-800 dark:text-white space-y-3 text-center">
                <h3 className="font-bold text-xs flex items-center justify-center gap-1.5 text-emerald-600 dark:text-emerald-400">
                  <Icon name="camera" size={18} /> Quick Camera
                </h3>
                <p className="text-[11px] text-slate-500 dark:text-zinc-400">Capture or select a photo to share in Over Talk</p>
                <button onClick={() => { setShowCameraModal(false); fileInputRef.current?.click(); }} className="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl text-xs transition">
                  Choose Photo / Snap Camera
                </button>
                <button onClick={() => setShowCameraModal(false)} className="text-[11px] text-slate-400 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-white">Close</button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
